<!doctype html>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRM Globe Demo</title>
<style>
  @font-face { font-family: "Ubuntu Sans"; src: url("UbuntuSans-Variable.latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Open Sans"; src: url("OpenSans-Variable.latin.woff2") format("woff2"); font-weight: 300 800; }
  :root {
    --bg:#0a0c0e; --panel:#13171a; --ink:#eef1f2; --muted:#8c979d; --line:#262d32;
    --accent:#ffce54; --red:#e5564b; --ok-ink:#8fd3b0;
    --display:"Ubuntu Sans", sans-serif; --body:"Open Sans", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* fixed 1920x1080 stage, scaled to fit the window */
  #vp { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: radial-gradient(circle at 36% 56%, #142029 0%, var(--bg) 62%); font-family: var(--body); color: var(--ink); user-select: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #gl.drag { cursor: grabbing; }
  .corner { position: absolute; width: 46px; height: 46px; border: 0 solid #3a444a; pointer-events: none; }
  .c-tl { left: 36px; top: 36px; border-left-width: 3px; border-top-width: 3px; }
  .c-tr { right: 36px; top: 36px; border-right-width: 3px; border-top-width: 3px; }
  .c-bl { left: 36px; bottom: 36px; border-left-width: 3px; border-bottom-width: 3px; }
  .c-br { right: 36px; bottom: 36px; border-right-width: 3px; border-bottom-width: 3px; }
  #scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px); }
  #top { position: absolute; left: 72px; top: 62px; }
  #top .k { font: 700 20px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  #top .t { font: 800 44px/1.15 var(--display); margin-top: 6px; }
  #top .s { font: 500 22px var(--body); color: var(--muted); margin-top: 6px; }
  #top { pointer-events: auto; }
  #cases { display: flex; gap: 10px; margin-top: 18px; }
  .case { font: 700 17px var(--display); letter-spacing: .06em; color: var(--muted); background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  .case:hover { color: var(--ink); border-color: #3a444a; }
  .case.on { color: #17140a; background: var(--accent); border-color: var(--accent); }
  #readout { position: absolute; right: 72px; top: 110px; font: 500 16px var(--mono); color: #5d686e; letter-spacing: .04em; pointer-events: none; }
  #mock { position: absolute; right: 72px; top: 80px; font: 600 18px var(--display); letter-spacing: .12em; text-transform: uppercase; color: #6f7a80; }
  #note { position: absolute; right: 72px; bottom: 20px; font: 500 15px var(--mono); color: #59656b; letter-spacing: .03em; }
  #swarm { position: absolute; left: 72px; top: 260px; width: 250px; pointer-events: none; opacity: 0; }
  #swarm b { display: block; font: 800 64px/1 var(--display); color: var(--ink); }
  #swarm span { display: block; margin-top: 8px; font: 500 16px/1.4 var(--mono); color: var(--muted); }
  #lang { position: absolute; right: 72px; top: 36px; display: flex; gap: 6px; }
  #lang button { font: 700 14px var(--display); letter-spacing: .06em; color: var(--muted); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  #lang button:hover { color: var(--ink); }
  #lang button.on { color: #17140a; background: var(--accent); border-color: var(--accent); }
  #viewSw { position: absolute; left: 1010px; top: 232px; display: flex; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px; }
  #viewSw button { font: 700 15px var(--display); letter-spacing: .06em; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  #viewSw button.on { color: #17140a; background: var(--accent); }
  #graph { position: absolute; left: 72px; top: 240px; width: 1150px; height: 500px; display: none; pointer-events: none; }
  #graph svg { overflow: visible; }
  #graph .gn { pointer-events: auto; cursor: pointer; }
  #graph .gtag { font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase; fill: var(--muted); }
  #graph .gname { font: 700 17px var(--display); fill: var(--ink); }
  #graph .gsub { font: 500 13px var(--mono); fill: var(--muted); }
  #graph .ring { animation: gpulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes gpulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lab { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; padding: 6px 12px; border-radius: 8px; background: rgba(10,12,14,.86); border: 2px solid var(--line); font: 700 19px var(--display); letter-spacing: .04em; cursor: pointer; transition: background .15s; }
  .lab:hover { background: #1c2328; }
  .lab .sub { display: block; font: 500 16px var(--mono); color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  .lab.red { border-color: rgba(229,86,75,.7); }
  .lab.yel { border-color: var(--accent); color: var(--accent); }
  .lab.grn { border-color: #2e5a44; color: var(--ok-ink); }
  .lab.below { transform: translate(-50%, 34px); }
  #panel { position: absolute; right: 72px; top: 150px; width: 560px; background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 26px 30px 22px; box-shadow: 0 4px 0 #050607; }
  #panel h3 { white-space: nowrap; gap: 16px; }
  #panel h3 { margin: 0 0 14px; font: 800 22px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 13px 10px; margin: 0 -10px; border-top: 2px solid #1d2327; font-size: 23px; line-height: 1.35; border-radius: 8px; transition: background .2s; }
  .row.hl { background: rgba(255,206,84,.09); }
  .row .k { font: 700 17px/1.9 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .row .v { font-weight: 600; }
  .row .v small { display: block; font: 500 17px var(--mono); color: var(--muted); margin-top: 2px; }
  .big { font: 800 40px var(--display); color: var(--accent); }
  .src { display: inline-block; font: 600 15px var(--mono); color: var(--accent); border: 1.5px solid rgba(255,206,84,.5); border-radius: 6px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; cursor: pointer; }
  .src:hover { background: rgba(255,206,84,.15); }
  #act { margin-top: 16px; display: flex; gap: 12px; }
  .btn { flex: 1; text-align: center; padding: 15px 0; border-radius: 12px; font: 800 21px var(--display); letter-spacing: .04em; border: 2px solid var(--line); color: var(--muted); background: transparent; cursor: pointer; }
  .btn:hover { border-color: #3a444a; color: var(--ink); }
  .btn.go { background: var(--accent); color: #17140a; border-color: var(--accent); }
  .btn.go:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: default; filter: none; }
  /* evidence card */
  #detail { position: absolute; left: 72px; bottom: 140px; width: 560px; background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; padding: 18px 22px; opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
  #detail.on { opacity: 1; transform: none; pointer-events: auto; }
  #detail .dk { font: 700 16px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; }
  #detail .dk span { cursor: pointer; color: var(--muted); }
  #detail .dt { font: 700 24px var(--display); margin: 6px 0 6px; }
  #detail .dd { font: 500 19px/1.45 var(--body); color: #c6cdd1; }
  #real { position: absolute; inset: 0; background: rgba(4,5,6,.78); display: none; align-items: center; justify-content: center; }
  #real.on { display: flex; }
  #real .card { width: 1180px; border-color: var(--accent); }
  #real .who { font: 600 20px var(--body); color: var(--muted); margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 22px 0; }
  .stat { background: #0f1316; border: 2px solid #1d2327; border-radius: 12px; padding: 14px 18px; }
  .stat b { display: block; font: 800 38px var(--display); color: var(--accent); }
  .stat span { font: 500 17px var(--body); color: #c6cdd1; }
  .rcols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 34px; }
  .rh { font: 700 16px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .rtl { position: relative; padding-left: 22px; }
  .rtl::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: #2b3237; }
  .rtl div { position: relative; padding: 5px 0; font: 500 18px/1.4 var(--body); color: #d3d9dc; }
  .rtl div::before { content: ''; position: absolute; left: -22px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .rtl em { display: block; font: 600 15px var(--mono); font-style: normal; color: var(--accent); }
  .rhelp div { font: 600 19px/1.4 var(--body); padding: 7px 0; border-top: 2px solid #1d2327; }
  .rq { margin-top: 16px; font: italic 500 19px/1.45 var(--body); color: #c6cdd1; border-left: 3px solid var(--accent); padding-left: 14px; }
  #real .fine { font: 500 15px var(--mono); color: #6f7a80; margin: 18px 0 14px; }
  #real a.btn { text-decoration: none; display: block; }
  #detail .dd a { color: var(--accent); font-weight: 700; text-decoration: none; }
  #detail .dd a:hover { text-decoration: underline; }
  #detail .dd .fine { display: block; margin-top: 10px; font: 500 15px var(--mono); color: #6f7a80; }
  #realBtn { font: 700 17px var(--display); letter-spacing: .06em; color: var(--accent); background: transparent; border: 2px dashed rgba(255,206,84,.55); border-radius: 999px; padding: 8px 18px; cursor: pointer; margin-left: 8px; }
  #realBtn:hover { background: rgba(255,206,84,.1); }
  #detail .dd code { font: 500 16px var(--mono); color: var(--muted); }
  /* step bar */
  #bar { position: absolute; right: 72px; bottom: 60px; width: 560px; }
  #cap { font: 600 21px/1.4 var(--body); color: #d3d9dc; min-height: 92px; margin-bottom: 14px; transition: opacity .22s, transform .22s; }
  #cap.swap { opacity: 0; transform: translateY(8px); }
  #cap b { color: var(--accent); font-family: var(--display); letter-spacing: .1em; font-size: 17px; text-transform: uppercase; display: block; margin-bottom: 2px; }
  #ctrl { display: flex; align-items: center; gap: 12px; }
  .cb { font: 700 18px var(--display); letter-spacing: .06em; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 10px 20px; cursor: pointer; }
  .cb:hover { border-color: var(--accent); }
  .cb:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  .cb.pri { background: var(--accent); color: #17140a; border-color: var(--accent); }
  .dots { display: flex; gap: 8px; margin: 0 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #2b3237; cursor: pointer; }
  .dot.on { background: var(--accent); }
  /* freeze request modal */
  #modal { position: absolute; inset: 0; background: rgba(4,5,6,.72); display: none; align-items: center; justify-content: center; }
  #modal.on { display: flex; }
  .card { width: 760px; background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 30px 36px; }
  .card h2 { margin: 0; font: 800 34px var(--display); }
  .card .k2 { font: 700 17px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .card .f { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 11px 0; border-top: 2px solid #1d2327; font: 600 21px/1.4 var(--body); }
  .card .f:first-of-type { margin-top: 18px; }
  .card .f .k { font: 700 16px/1.9 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card .note { font: 500 18px var(--body); color: var(--muted); margin: 14px 0 18px; }
  .card .row2 { display: flex; gap: 12px; }
  #toast { position: absolute; left: 50%; top: 40px; transform: translate(-50%, -20px); background: #1f3329; color: var(--ok-ink); border: 2px solid #2e5a44; border-radius: 12px; padding: 12px 22px; font: 700 20px var(--display); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #hint { white-space: nowrap; font: 600 15px var(--display); letter-spacing: .1em; text-transform: uppercase; color: #59656b; margin-left: auto; transition: opacity .4s; }
  /* case timeline */
  #tl { position: absolute; left: 72px; bottom: 54px; width: 1150px; }
  #tlTop { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  #play { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; color: var(--accent); font-size: 17px; cursor: pointer; flex: none; }
  #play:hover { background: rgba(255,206,84,.12); }
  #clock { font: 700 22px var(--mono); color: var(--ink); letter-spacing: .02em; white-space: nowrap; }
  #evt { font: 600 20px var(--body); color: #c6cdd1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #evt b { color: var(--accent); font: 800 15px var(--display); letter-spacing: .12em; text-transform: uppercase; margin-right: 8px; }
  #track { position: relative; height: 34px; cursor: pointer; touch-action: none; }
  #track { margin-right: 24px; }
  #rail { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: #252c31; }
  #fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--red), var(--accent)); }
  #head { position: absolute; top: 4px; width: 4px; height: 26px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.6); }
  .mk { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #1b2125; border: 3px solid #3a444a; transition: background .2s, border-color .2s; }
  .mk.hit.red { border-color: var(--red); background: #3a1d1b; }
  .mk.hit.yel { border-color: var(--accent); background: #3a3220; }
  .mk:hover { transform: scale(1.25); }
  .mk .tip { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font: 600 14px var(--mono); color: #6f7a80; white-space: nowrap; }
  .mk.hit .tip { color: #aab4b9; }
</style>
</head>
<body>
<div id="vp">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="labels"></div>
  <div id="scan"></div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
  <div id="top">
    <div class="k" id="kick"></div>
    <div class="t" id="ttl"></div>
    <div class="s" id="sub"></div>
    <div id="cases"></div>
  </div>
  <div id="mock" data-i="mock"></div>
  <div id="lang"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="ko">한국어</button></div>
  <div id="note" data-i="note"></div>
  <div id="panel">
    <h3><span data-i="sum"></span><b id="status">TRACING</b></h3>
    <div id="rows"></div>
    <div id="act" data-at="16.6"><button class="btn go" id="b1">Alert the exchange</button><button class="btn" id="b2" data-i="export"></button></div>
  </div>
  <div id="detail"><div class="dk"><em id="dk" style="font-style:normal"></em><span id="dx" data-i="close"></span></div><div class="dt" id="dt"></div><div class="dd" id="dd"></div></div>
  <div id="readout"></div>
  <div id="graph"><svg id="gsvg" viewBox="0 0 1150 500" width="1150" height="500"></svg></div>
  <div id="viewSw"><button data-v="globe" data-i="vGlobe"></button><button data-v="graph" data-i="vGraph"></button></div>
  <div id="swarm"><b id="swn"></b><span id="swl"></span></div>
  <div id="tl">
    <div id="tlTop"><button id="play" title="Play the whole case">▶</button><div id="clock"></div><div id="evt"></div><div id="hint" data-i="hint"></div></div>
    <div id="track"><div id="rail"></div><div id="fill"></div><div id="marks"></div><div id="head"></div></div>
  </div>
  <div id="bar">
    <div id="cap"></div>
    <div id="ctrl">
      <button class="cb" id="back" data-i="back"></button>
      <div class="dots" id="dots"></div>
      <button class="cb pri" id="next" data-i="next"></button>
      <button class="cb" id="reset" data-i="reset"></button>
    </div>
  </div>
  <div id="modal"><div class="card">
    <div class="k2" id="mk"></div>
    <h2 id="mt"></h2>
    <div id="mf"></div>
    <div class="note" data-i="mnote"></div>
    <div class="row2"><button class="btn go" id="approve" data-i="approve"></button><button class="btn" id="cancel" data-i="cancel"></button></div>
  </div></div>
  <div id="real"><div class="card">
    <div class="k2" id="rk"></div>
    <h2 id="rt"></h2>
    <div class="who" id="rw"></div>
    <div class="stats" id="rs"></div>
    <div class="rcols"><div><div class="rh" data-i="what"></div><div class="rtl" id="rl"></div></div>
      <div><div class="rh" id="rht"></div><div class="rhelp" id="rhl"></div><div class="rq" id="rqt"></div></div></div>
    <div class="fine" data-i="fine"></div>
    <div class="row2"><a class="btn go" id="rlink" target="_blank" rel="noopener" data-i="read"></a><button class="btn" id="rclose" data-i="backDemo"></button></div>
  </div></div>
  <div id="toast"></div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/countries-50m.js"></script>
<script src="vendor/textures.js"></script>
<script>
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out3 = x => 1 - Math.pow(1 - x, 3);
const outBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const D2R = Math.PI / 180, R = 1;
const $ = id => document.getElementById(id);

// scale the 1920x1080 stage to the window
const vpEl = $('vp'); let scale = 1;
function fit() { scale = Math.min(innerWidth / W, innerHeight / H); vpEl.style.transform = `scale(${scale}) translate(-50%, -50%)`; }
addEventListener('resize', fit); fit();

function v3(lat, lon, r = R) { const p = lat * D2R, l = lon * D2R; return new THREE.Vector3(r * Math.cos(p) * Math.sin(l), r * Math.sin(p), r * Math.cos(p) * Math.cos(l)); }

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(W, H, false);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 100);
const globe = new THREE.Group();
const tilt = new THREE.Group(); tilt.add(globe); scene.add(tilt);

// earth: NASA Blue Marble + Black Marble city lights, graded cool to sit in the dark UI
const tl = new THREE.TextureLoader(), aniso = renderer.capabilities.getMaxAnisotropy();
const tex = k => { const x = tl.load(TEX[k]); x.anisotropy = aniso; return x; };
const earthMat = new THREE.ShaderMaterial({
  uniforms: { day: { value: tex('day') }, night: { value: tex('night') }, water: { value: tex('water') }, topo: { value: tex('topo') }, L: { value: new THREE.Vector3(-.55, .45, .7).normalize() } },
  vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){ vUv = uv; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform sampler2D day, night, water, topo; uniform vec3 L; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vec3 N = normalize(vN), V = normalize(vV);
      vec3 d = texture2D(day, vUv).rgb;
      float lum = dot(d, vec3(.299, .587, .114));
      vec3 g = mix(vec3(lum), d, .5) * vec3(.66, .8, .9);
      float e = 1. / 2048.;
      float hx = texture2D(topo, vUv + vec2(e, 0.)).r - texture2D(topo, vUv - vec2(e, 0.)).r;
      float hy = texture2D(topo, vUv + vec2(0., e)).r - texture2D(topo, vUv - vec2(0., e)).r;
      float relief = clamp(1. + (-hx + hy) * 5., .7, 1.35);
      float lam = clamp(dot(N, L), 0., 1.);
      vec3 col = g * relief * (.3 + .9 * lam);
      float w = texture2D(water, vUv).r;
      col += vec3(.65, .82, 1.) * pow(max(dot(reflect(-L, N), V), 0.), 36.) * w * .45;
      col += texture2D(night, vUv).rgb * vec3(1., .78, .42) * (1. - smoothstep(0., .45, lam)) * .85;
      col += vec3(.32, .55, .72) * pow(1. - max(dot(N, V), 0.), 3.) * .7;
      gl_FragColor = vec4(col, 1.);
    }`,
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(R, 192, 128), earthMat);
earth.rotation.y = -Math.PI / 2; // texture u=0.5 (lon 0) faces +z, matching v3()
globe.add(earth);
// atmosphere halo

for (let lon = -180; lon < 180; lon += 30) { const pts = []; for (let lat = -90; lat <= 90; lat += 2) pts.push(v3(lat, lon, 1.0015)); globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gratMat)); }

// country borders and coastlines (Natural Earth 50m)
function meshLines(ml, mat) {
  const pos = [];
  for (const line of ml.coordinates) for (let i = 1; i < line.length; i++) {
    const a = v3(line[i - 1][1], line[i - 1][0], 1.002), b = v3(line[i][1], line[i][0], 1.002);
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  globe.add(new THREE.LineSegments(g, mat));
}

meshLines(topojson.mesh(COUNTRIES, COUNTRIES.objects.countries, (a, b) => a === b), new THREE.LineBasicMaterial({ color: 0x9fc3d3, transparent: true, opacity: .32, depthWrite: false }));

  loadCase(ci); scrubTo(keepT);
  if (wasPlaying && keepT < END) { playing = true; target = END; $('play').textContent = '❚❚'; }
  if (wasApproved) { approved = true; hT = 99; $('b1').disabled = true; $('b1').textContent = u('sharedB'); setCap(`<b>${u('realOut')}</b>${C.done.cap}`); }
});
applyUI();
try { if (localStorage.getItem('trm-demo-view') === 'graph') setTimeout(() => setMode('graph')); } catch (e) {}
setMode('globe');
{ const b = document.createElement('button'); b.id = 'realBtn'; b.onclick = () => showReal(); $('cases').appendChild(b); }
// captions cross-fade between steps; the latest one wins if steps change fast (scrubbing)
let capHtml = '', capTimer = null;
function setCap(html) {
  if (html === capHtml) return; capHtml = html; $('cap').classList.add('swap');
  if (!capTimer) capTimer = setTimeout(() => { $('cap').innerHTML = capHtml; $('cap').classList.remove('swap'); capTimer = null; }, 220);
}
function setStep(i) {
  step = clamp(i, 0, STOPS.length - 1);
  setCap(`<b>${C.steps[step][0]}</b>${C.steps[step][1]}`);
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k <= step));
  $('back').disabled = step === 0; $('next').disabled = step === STOPS.length - 1;
}
function go(i) {
  setStep(i); t = step ? STOPS[step - 1] : 0;
  target = END; playing = true; $('play').textContent = '❚❚';
  hideDetail();
}

// --- case timeline: story time t maps onto real case timestamps ---
const END = STOPS[STOPS.length - 1];
let playing = false;
// markers sit evenly by event (not by story time) so close dates stay readable
function knots() { const n = C.events.length; return [[0, 0], ...C.events.map((ev, i) => [ev.t, (i + 1) / n])]; }
function xOf(t) { const K = knots(); for (let i = 1; i < K.length; i++) if (t <= K[i][0]) return lerp(K[i - 1][1], K[i][1], seg(t, K[i - 1][0], K[i][0])); return 1; }
function tOf(x) { const K = knots(); for (let i = 1; i < K.length; i++) if (x <= K[i][1]) return lerp(K[i - 1][0], K[i][0], seg(x, K[i - 1][1], K[i][1])); return END; }
function buildTimeline() {
  $('marks').innerHTML = '';
  C.events.forEach(ev => {
    const m = document.createElement('div'); m.className = 'mk ' + (ev.yel ? 'yel' : 'red');
    m.style.left = (xOf(ev.t) * 100) + '%'; m.title = ev.name;
    m.innerHTML = `<span class="tip">${ev.tip}</span>`;
    m.onpointerdown = e => { e.stopPropagation(); scrubTo(Math.min(END, ev.t + .7)); };
    $('marks').appendChild(m); ev.el = m;
  });
}
function drawTimeline() {
  const k = xOf(t) * 100;
  $('fill').style.width = k + '%'; $('head').style.left = k + '%';
  let cur = null; for (const ev of C.events) { const hit = t >= ev.t; ev.el.classList.toggle('hit', hit); if (hit) cur = ev; }
  $('clock').textContent = (cur || C.events[0]).when.toUpperCase();
  if (approved && t >= END - .01) cur = { when: C.events[C.events.length - 1].when, name: C.done.line, shared: true };
  $('evt').innerHTML = cur ? `<b>${u(cur.shared ? 'outcome' : cur.yel ? 'found' : 'event')}</b>${cur.name}` : `<b>${u('starting')}</b>${u('startingT')}`;
}
function stopPlay() { playing = false; target = t; $('play').textContent = '▶'; }
function scrubTo(v) {
  stopPlay(); t = target = clamp(v, 0, END);
  let i = 0; while (i < STOPS.length - 1 && STOPS[i] <= t) i++; // same rule as playback: reaching a stop starts the next step
  setStep(i); hideDetail();
}
let scrub = false;
const trackT = e => { const r = $('track').getBoundingClientRect(); return tOf(clamp((e.clientX - r.left) / r.width)); };
$('track').addEventListener('pointerdown', e => { scrub = true; $('track').setPointerCapture(e.pointerId); scrubTo(trackT(e)); });
$('track').addEventListener('pointermove', e => { if (scrub) scrubTo(trackT(e)); });
$('track').addEventListener('pointerup', () => { scrub = false; });
$('play').onclick = () => {
  if (playing) { stopPlay(); return; }
  if (t >= END - .01) { t = 0; setStep(0); }
  playing = true; target = END; $('play').textContent = '❚❚'; hideDetail();
};
$('next').onclick = () => go(step + 1);
$('back').onclick = () => go(step - 1);
$('reset').onclick = () => { userLon = 0; userLat = 0; zoom = 1; };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(step + 1); if (e.key === 'ArrowLeft') go(step - 1); if (e.key === 'Escape') { $('modal').classList.remove('on'); $('real').classList.remove('on'); hideDetail(); } });

// --- drag to spin, wheel to zoom ---
let drag = null;
$('gl').addEventListener('pointerdown', e => { if (mode === 'graph') return; drag = { x: e.clientX, y: e.clientY }; $('gl').classList.add('drag'); $('gl').setPointerCapture(e.pointerId); $('hint').style.opacity = 0; });
$('gl').addEventListener('pointermove', e => {
  if (!drag) return;
  userLon -= (e.clientX - drag.x) / scale * .18; userLat = clamp(userLat + (e.clientY - drag.y) / scale * .15, -60, 60);
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; $('gl').classList.remove('drag'); });
$('gl').addEventListener('wheel', e => { e.preventDefault(); zoom = clamp(zoom * Math.exp(e.deltaY * .001), .75, 1.35); }, { passive: false });

// --- evidence card, sources, row highlight ---
function show(k) {
  if (playing) stopPlay(); const [a, b, c] = C.info[k]; $('dk').textContent = a; $('dt').textContent = b; $('dd').innerHTML = c; $('detail').classList.add('on'); }
// the real-world card: published facts only, kept apart from the made-up trace
let realShown = false;
function showReal() {
  if (playing) stopPlay();
  const r = C.real;
  $('rk').textContent = u('realK') + r.src; $('rt').textContent = r.title; $('rw').textContent = r.who;
  $('rs').innerHTML = r.stats.map(([v, k]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  $('rl').innerHTML = r.tl.map(([w, d]) => `<div><em>${w}</em>${d}</div>`).join('');
  $('rht').textContent = r.helpT; $('rhl').innerHTML = r.help.map(h => `<div>${h}</div>`).join('');
  $('rqt').textContent = '"' + r.quote + '"'; $('rlink').href = r.url;
  $('real').classList.add('on');
}
$('rclose').onclick = () => $('real').classList.remove('on');
$('real').onclick = e => { if (e.target === $('real')) $('real').classList.remove('on'); };
function hideDetail() { $('detail').classList.remove('on'); document.querySelectorAll('.row.hl').forEach(r => r.classList.remove('hl')); }
function hl(id) { document.querySelectorAll('.row.hl').forEach(r => r.classList.remove('hl')); if (id !== undefined && $('r' + id)) $('r' + id).classList.add('hl'); }
$('dx').onclick = hideDetail;

// --- freeze request flow ---
const toast = (msg, ms) => { $('toast').textContent = msg; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), ms); };
$('b1').onclick = () => { if (step < 4) go(4); else scrubTo(END); $('modal').classList.add('on'); };
$('cancel').onclick = () => $('modal').classList.remove('on');
$('approve').onclick = () => {
  approved = true; $('modal').classList.remove('on');
  $('b1').disabled = true;
  toast(C.done.toast, 3200);
  $('b1').textContent = u('sharedB'); setCap(`<b>${u('realOut')}</b>${C.done.cap}`);
};
$('b2').onclick = () => toast(u('exportT'), 2000);

const screen = new THREE.Vector3(), camDir = new THREE.Vector3();
function render(clk) {
  const T = t, v = view(t);
  const shown = approved && t >= END - .01, hk = shown ? inOut(seg(hT, 0, 1.8)) : 0, hc = C.hcam;
  v.lon = lerp(v.lon, hc.lon, hk); v.lat = lerp(v.lat, hc.lat, hk); v.dist = lerp(v.dist, 6.0 + (hc.d - 4.5) * .4, hk);
  const lon = v.lon + userLon, lat = clamp(v.lat + userLat, -70, 70);
  globe.rotation.y = -lon * D2R; tilt.rotation.x = lat * D2R;
  cam.position.set(0, 0, v.dist * zoom); cam.lookAt(0, 0, 0); cam.setViewOffset(W, H, 280, -30, W, H);
  cam.updateMatrixWorld(); scene.updateMatrixWorld(true);

  ambient(clk, shown ? .45 : 1 - .3 * seg(t, 3, 4));
  for (const a of arcs) {
    const at = a.h ? (shown ? hT : -1) : t, k = inOut(seg(at, a.t0, a.t1)), n = Math.floor(k * a.N);
    a.line.geometry.setDrawRange(0, n + 1);
    a.tube.geometry.setDrawRange(0, Math.floor(a.idx * k / 6) * 6);
    a.head.visible = k > 0 && k < 1; a.head.position.copy(a.curve.getPoint(k));
    const fade = a.h ? 1 : 1 - .45 * seg(t, a.t1 + 1.5, a.t1 + 3);
    a.line.material.opacity = fade; a.tube.material.opacity = .8 * fade;
  }
  camDir.copy(cam.position).normalize();
  for (const key in pins) {
    const p = pins[key], [ta, tl, tx] = p.t, t = p.h ? (shown ? hT : -1) : T;
    const w = p.at.clone(); caseGroup.localToWorld(w);
    const facing = w.clone().normalize().dot(camDir);
    if (p.grp) {
      p.grp.scale.setScalar(Math.max(.001, outBack(seg(t, ta, ta + .5))));
      const ph = (clk % 1.6) / 1.6;
      p.ring.material.opacity = .9 * (1 - ph); p.ring.scale.setScalar(1 + ph * 1.4);
      p.ring2.material.opacity = p.end && !approved ? .9 * (Math.sin(clk * 4) * .5 + .5) * seg(t, 13.6, 14) : 0;
    }
    screen.copy(w).project(cam);
    const x = (screen.x * .5 + .5) * W, y = (-screen.y * .5 + .5) * H;
    // victim labels clear once the panel takes over; the Victims row keeps their details
    const out = p.role === 'victim' ? (1 - seg(t, tx, tx + .35)) : 1;
    // after the handoff only the exchange and the agencies keep labels
    const clear = shown && !p.h && !p.end ? 1 - seg(hT, .3, .9) : 1;
    const vis = seg(t, tl, tl + .35) * out * clear * clamp((facing - .15) * 5);
    p.el.style.opacity = vis; p.el.style.pointerEvents = vis > .3 ? 'auto' : 'none';
    p.el.style.left = (x + p.dx) + 'px'; p.el.style.top = (p.dy + (p.el.classList.contains('below') ? y : y - 22)) + 'px';
  }

  $('panel').style.opacity = seg(t, 8.9, 9.4);
  $('panel').style.pointerEvents = t > 9 ? 'auto' : 'none';
  $('panel').style.transform = `translateX(${(1 - out3(seg(t, 8.9, 9.6))) * 40}px)`;
  document.querySelectorAll('[data-at]').forEach(el => { const a = +el.dataset.at, k = out3(seg(t, a, a + .45)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 12}px)`; el.style.pointerEvents = k > .5 ? 'auto' : 'none'; });
  const amt = C.big.v * out3(seg(t, 15.4, 16.6));
  const [num, unit] = amt >= 1e9 ? [(amt / 1e9).toFixed(1), LANG === 'fr' ? ' Md' : 'B'] : amt >= 1e6 ? [(amt / 1e6).toFixed(1), LANG === 'fr' ? ' M' : 'M'] : [String(Math.round(amt / 1e3)), LANG === 'fr' ? ' k' : 'K'];
  $('amt').textContent = C.big.n ? Math.round(amt) : (C.big.approx ? '~' : '') + (LANG === 'fr' ? num.replace('.', ',') + unit + '$' : '$' + num + unit);
  const st = $('status');
  if (approved) { st.textContent = u('shared'); st.style.color = 'var(--ok-ink)'; }
  else if (step === 4) { st.textContent = u('awaiting'); st.style.color = 'var(--accent)'; }
  else { st.textContent = u('tracing'); st.style.color = 'var(--red)'; }

  $('readout').textContent = `LAT ${lat.toFixed(2)}°  LON ${(((lon + 540) % 360) - 180).toFixed(2)}°  ·  ${u('chains')} ${C.chains}`;
  drawGraph(shown);
  drawSwarm();
  drawTimeline();
  renderer.render(scene, cam);
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(.05, ((now || last) - last) / 1000); last = now || last;
  if (ready) {
    if (t < target) t = Math.min(target, t + dt * 1.15);
    if (approved) hT += dt;
    if (playing) { while (step < STOPS.length - 1 && t >= STOPS[step]) setStep(step + 1); if (t >= END) { playing = false; $('play').textContent = '▶'; } }
    if (!drag) userLon += dt * .6; // slow idle drift
    render(now / 1000 || 0);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
